<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" target="resultFrame">
        <label>Enter Name:</label>
        <input type="text" name="name" required>

        <input type="submit" value="Submit">
    </form>

    <br>

    <iframe
        name="resultFrame"
        width="500"
        height="150"
        title="Result">
    </iframe>

</body>
</html>
