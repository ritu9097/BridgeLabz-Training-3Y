<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h1>My City Map</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible -->
    <iframe
        src="https://www.google.com/maps?q=Faridabad&output=embed"
        title="Google Map of Faridabad"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
