<!DOCTYPE html>
<html>
<head>

    <!-- Sets the title displayed in the browser tab -->
    <title>Complete Head Example</title>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description" content="Example webpage demonstrating important HTML head elements">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Ritesh">

    <!-- Sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- CSS can be written inside the style element -->
    <style>
    </style>

    <!-- JavaScript can be written inside the script element -->
    <script>
    </script>

</head>
<body>

    <h1>Complete HTML Head Example</h1>

    <p>
        This page demonstrates important elements inside the HTML head section.
    </p>

</body>
</html>
